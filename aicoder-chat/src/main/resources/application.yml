server:
  port: 8082

spring:
  application:
    name: aicoder-chat
  config:
    import:
      # 共享配置：与 aicoder-skill 读同一份 skill.directory
      - optional:nacos:aicoder-shared.yml
  cloud:
    nacos:
      server-addr: localhost:8848
      discovery:
        server-addr: localhost:8848
        ip: 127.0.0.1
  datasource:
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/test_ai?characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=false&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
  data:
    redis:
      host: localhost
      port: 6379
      password: ${REDIS_PASSWORD:}
  ai:
    ollama:
      base-url: http://localhost:11434
    deepseek:
      api-key: ${DEEPSEEK_API_KEY:}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

# 技能共享目录：本地兜底，可被 Nacos aicoder-shared.yml 或 SKILL_DIRECTORY 覆盖
skill:
  directory: ${SKILL_DIRECTORY:./skills}
